<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  min-height: 100%;
  overflow-x: hidden;
  background: #000;
  color: #c0deff;
  font-family: 'Cinzel', Georgia, serif;
}

/* ── SHADOW REALM BG ── */
body::before {
  content: "";
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(0,20,70,.9),  transparent 50%),
    radial-gradient(ellipse at 0%   50%, rgba(0,0,50,.8),   transparent 55%),
    radial-gradient(ellipse at 100% 50%, rgba(5,0,40,.8),   transparent 55%),
    radial-gradient(ellipse at 50% 110%,rgba(0,10,50,.9),   transparent 60%);
  z-index: -20;
  pointer-events: none;
}

/* ── MOONLIGHT ── */
body::after {
  content: "";
  position: fixed;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 220px; height: 50vh;
  background: linear-gradient(to bottom, rgba(60,140,255,.08), transparent 80%);
  clip-path: polygon(28% 0%, 72% 0%, 100% 100%, 0% 100%);
  pointer-events: none;
  z-index: -5;
  animation: moonBeam 10s ease-in-out infinite;
}
@keyframes moonBeam {
  0%,100% { opacity: .4; }
  50%     { opacity: .8; }
}

/* ── CANVAS ── */
#smokeCanvas, #flameCanvas {
  position: fixed; inset: 0;
  pointer-events: none;
}
#smokeCanvas { z-index: -12; }
#flameCanvas { z-index: -8; }

/* ── RAIN ── */
.rain { position: fixed; inset: 0; pointer-events: none; z-index: -6; overflow: hidden; }
.drop {
  position: absolute; bottom: 100%;
  width: 1px; height: 70px;
  background: linear-gradient(to bottom, transparent, rgba(0,140,255,.45));
  animation: fall linear infinite;
}
@keyframes fall { to { transform: translateY(115vh); } }

/* ── NAV ── */
nav {
  position: sticky; top: 0;
  display: flex; justify-content: center; flex-wrap: wrap;
  gap: 6px; padding: 12px 16px;
  background: rgba(0,0,10,.65);
  backdrop-filter: blur(14px);
  z-index: 100;
  border-bottom: 1px solid rgba(0,120,255,.2);
}
nav a {
  font-family: 'Cinzel', serif;
  font-size: 11px; letter-spacing: 3px;
  color: rgba(130,190,255,.7);
  text-decoration: none;
  padding: 8px 16px;
  border-radius: 30px;
  border: 1px solid rgba(0,100,255,.2);
  background: rgba(0,0,20,.4);
  transition: .25s;
  text-transform: uppercase;
}
nav a:hover {
  color: #fff;
  background: rgba(0,70,180,.3);
  border-color: rgba(0,150,255,.5);
  box-shadow: 0 0 14px rgba(0,120,255,.4);
}

/* ── HEADER ── */
header {
  text-align: center;
  padding: 50px 20px 10px;
  position: relative; z-index: 2;
}
header h1 {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(22px, 5vw, 46px);
  letter-spacing: 5px;
  color: #80c0ff;
  text-shadow: 0 0 15px rgba(0,120,255,.8), 0 0 40px rgba(0,80,200,.5);
  animation: titleShimmer 6s ease-in-out infinite;
}
header .sub {
  font-size: 12px;
  letter-spacing: 6px;
  color: rgba(120,180,255,.4);
  margin-top: 10px;
  text-transform: uppercase;
}
@keyframes titleShimmer {
  0%,100% { text-shadow: 0 0 15px rgba(0,120,255,.8), 0 0 40px rgba(0,80,200,.5); }
  50%     { text-shadow: 0 0 25px rgba(0,180,255,.9), 0 0 60px rgba(0,120,255,.7), 0 0 100px rgba(0,60,200,.4); }
}

/* ── GLASS BOXES ── */
.box {
  max-width: 900px;
  margin: 28px auto;
  padding: 24px 28px;
  background: rgba(0,10,30,.55);
  border: 1px solid rgba(0,120,255,.25);
  border-radius: 18px;
  backdrop-filter: blur(14px);
  box-shadow: 0 0 25px rgba(0,80,200,.12), inset 0 0 30px rgba(0,20,60,.3);
  transition: .3s ease;
  position: relative; overflow: hidden;
  z-index: 2;
}
/* Neon top edge */
.box::before {
  content: "";
  position: absolute;
  top: 0; left: 8%; right: 8%;
  height: 1px;
  background: linear-gradient(to right, transparent, rgba(0,160,255,.6), transparent);
}
.box:hover {
  transform: translateY(-8px) scale(1.015);
  box-shadow: 0 0 40px rgba(0,120,255,.3), inset 0 0 40px rgba(0,30,80,.4);
  border-color: rgba(0,160,255,.45);
}
.box h2 {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(14px, 2.5vw, 20px);
  letter-spacing: 3px;
  color: #70b8ff;
  margin-bottom: 18px;
  text-shadow: 0 0 12px rgba(0,120,255,.5);
}
.box iframe {
  display: block; border: 0;
  border-radius: 12px;
}

/* ── STAY LEGENDARY FOOTER ── */
.legendFooter {
  text-align: center;
  padding: 30px 20px 50px;
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(11px, 2vw, 14px);
  letter-spacing: 6px;
  color: rgba(80,160,255,.5);
  text-transform: uppercase;
  animation: footerPulse 5s ease-in-out infinite;
  position: relative; z-index: 2;
}
@keyframes footerPulse {
  0%,100% { opacity: .5; }
  50%     { opacity: 1; text-shadow: 0 0 20px rgba(0,120,255,.5); }
}

@media (max-width: 600px) {
  .box { margin: 16px; padding: 16px; }
  header { padding: 30px 14px 6px; }
}

<script>
const isMobile = window.innerWidth < 600;
const W = () => innerWidth, H = () => innerHeight;
function fitCanvas(c){ c.width = W(); c.height = H(); }

/* ── RAIN ── */
const rain = document.getElementById("rain");
const dropCount = isMobile ? 28 : 55;
for(let i = 0; i < dropCount; i++){
  const d = document.createElement("div");
  d.className = "drop";
  d.style.left = Math.random()*100 + "vw";
  d.style.animationDuration = (.6 + Math.random()*1.4) + "s";
  d.style.animationDelay = (Math.random()*2) + "s";
  rain.appendChild(d);
}

/* ── SMOKE ── */
const smokeC = document.getElementById("smokeCanvas");
const mctx = smokeC.getContext("2d");
fitCanvas(smokeC);
const smokePs = Array.from({ length: isMobile ? 20 : 45 }, () => ({
  x: Math.random()*W(), y: H()+Math.random()*100,
  r: 25+Math.random()*70, vy: -(0.2+Math.random()*.6),
  vx: (Math.random()-.5)*.4, alpha: .025+Math.random()*.06,
  life: Math.random()*180
}));
function drawSmoke(){
  mctx.clearRect(0,0,W(),H());
  for(const p of smokePs){
    const g = mctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
    g.addColorStop(0,`rgba(8,25,70,${p.alpha})`);
    g.addColorStop(1,"transparent");
    mctx.fillStyle=g; mctx.beginPath(); mctx.arc(p.x,p.y,p.r,0,Math.PI*2); mctx.fill();
    p.x+=p.vx; p.y+=p.vy; p.life--;
    if(p.life<=0||p.y<-p.r*2){ p.x=Math.random()*W(); p.y=H()+p.r; p.life=130+Math.random()*150; }
  }
  requestAnimationFrame(drawSmoke);
}
drawSmoke();

/* ── BLUE FLAMES ── */
const flameC = document.getElementById("flameCanvas");
const fctx = flameC.getContext("2d");
fitCanvas(flameC);
const flames = Array.from({ length: isMobile ? 40 : 80 }, () => ({
  x: Math.random()*W(), y: H()+Math.random()*60,
  s: 2+Math.random()*7, vy: .8+Math.random()*2,
  vx: (Math.random()-.5)*1.1, alpha: .15+Math.random()*.4,
  hue: 195+Math.random()*35
}));
let lastF = 0, beat = 0;
setInterval(() => { beat = Math.random(); }, isMobile ? 500 : 250);

function drawFlames(ts){
  if(ts-lastF<(isMobile?33:16)){ requestAnimationFrame(drawFlames); return; }
  lastF=ts;
  fctx.fillStyle="rgba(0,0,0,.15)"; fctx.fillRect(0,0,W(),H());
  for(const f of flames){
    const g=fctx.createRadialGradient(f.x,f.y,0,f.x,f.y,(f.s+beat*4)*3);
    g.addColorStop(0,`hsla(${f.hue},100%,65%,${f.alpha})`);
    g.addColorStop(.6,`hsla(${f.hue},100%,45%,${f.alpha*.3})`);
    g.addColorStop(1,"transparent");
    fctx.fillStyle=g; fctx.beginPath(); fctx.arc(f.x,f.y,(f.s+beat*4)*3,0,Math.PI*2); fctx.fill();
    f.x+=f.vx; f.y-=f.vy+beat*3;
    if(f.y<-60){ f.y=H()+60; f.x=Math.random()*W(); }
  }
  requestAnimationFrame(drawFlames);
}
requestAnimationFrame(drawFlames);

window.addEventListener("resize", ()=>{ fitCanvas(smokeC); fitCanvas(flameC); }, { passive:true });
</script>

<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", () =>
