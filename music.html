<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legend Music Hub</title>

<!-- Web App Manifest -->
<link rel="manifest" href="manifest.json">
<!-- Preconnect to embed providers so iframes load faster -->
<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://open.spotify.com">
<link rel="preconnect" href="https://elfsightcdn.com">
<link rel="dns-prefetch" href="https://elfsightcdn.com">

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #000;
  color: #cfefff;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

/* CINEMATIC BACKGROUND — static gradient, no animation */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 20%, rgba(0,200,255,.25), transparent 45%),
    radial-gradient(circle at 80% 70%, rgba(0,120,255,.18), transparent 50%);
  z-index: -20;
}

/* HEADER */
header {
  text-align: center;
  padding: 60px 20px 10px;
}

h1 {
  font-size: 46px;
  text-shadow:
    0 0 20px #00c8ff,
    0 0 50px #0099ff;
  animation: floatTitle 4s ease-in-out infinite;
  /* Slowed: was 3s */
}

@media (max-width: 600px) {
  h1 { font-size: 28px; }
  .box { margin: 15px; padding: 14px; }
}

@keyframes floatTitle {
  0%,100% { transform: translateY(0px); }
  50%      { transform: translateY(-7px); }
}

/* BOXES */
.box {
  max-width: 900px;
  margin: 25px auto;
  padding: 20px;
  background: rgba(0,0,0,.75);
  border: 1px solid #00c8ff;
  border-radius: 16px;
  box-shadow: 0 0 20px rgba(0,200,255,.2);
  backdrop-filter: blur(10px);
  transition: 0.3s ease;
  will-change: transform;
}

.box:hover {
  transform: translateY(-10px) scale(1.02);
  box-shadow: 0 0 30px #00c8ff;
}

/* iframe lazy container */
.box iframe {
  display: block;
  border: 0;
  border-radius: 10px;
}

/* NAV */
nav {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 15px;
}

nav a {
  color: #00c8ff;
  text-decoration: none;
  padding: 10px 16px;
  border-radius: 12px;
  border: 1px solid rgba(0,200,255,.35);
  background: rgba(0,0,0,.6);
  transition: 0.25s;
  box-shadow: 0 0 8px rgba(0,200,255,.15);
}

nav a:hover {
  transform: translateY(-6px) scale(1.08);
  box-shadow: 0 0 25px #00c8ff;
  background: rgba(0,200,255,.15);
  color: #fff;
}

/* CANVAS LAYERS */
#rainCanvas, #fireCanvas, #vortexCanvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}

#rainCanvas  { z-index: -10; }
#fireCanvas  { z-index: -9; }
#vortexCanvas{ z-index: -8; }
</style>
</head>

<body>

<canvas id="rainCanvas"></canvas>
<canvas id="fireCanvas"></canvas>
<canvas id="vortexCanvas"></canvas>

<header>
  <h1>🎧 LEGEND MUSIC HUB</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="gallery.html">Gallery</a>
    <a href="about.html">About</a>
    <a href="chat room.html">Chat Room</a>
  </nav>
</header>

<div class="box">
  <h2>🎬 YouTube Music</h2>
  <!-- loading="lazy" defers iframe until in view -->
  <iframe width="100%" height="315"
    src="https://www.youtube.com/embed/videoseries?list=UUE_cbs14G_QUfPOvByU1q9w"
    loading="lazy"
    allowfullscreen></iframe>
</div>

<div class="box">
  <h2>🎧 Spotify Artist</h2>
  <iframe width="100%" height="352"
    src="https://open.spotify.com/embed/artist/010qnpDsNjUeyIkyV2Fnlr"
    loading="lazy"
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
</div>

<!-- Elfsight Audio Player — async so it doesn't block page -->
<script src="https://elfsightcdn.com/platform.js" async defer></script>
<div class="elfsight-app-3d43432f-da69-4ed7-9dcb-1a8bcd38b575" data-elfsight-app-lazy></div>

<script>
const isMobile = window.innerWidth < 600;

/* Shared beat value — throttled to 4fps instead of every 250ms */
let beat = 0;
setInterval(() => { beat = Math.random(); }, isMobile ? 500 : 250);

/* Helper: resize canvas to window */
function fitCanvas(c){
  c.width  = innerWidth;
  c.height = innerHeight;
}

/* ── RAIN ── */
const rain  = document.getElementById("rainCanvas");
const rctx  = rain.getContext("2d");
fitCanvas(rain);

const dropCount = isMobile ? 80 : 160; /* was 200 */
const drops = Array.from({ length: dropCount }, () => ({
  x: Math.random() * rain.width,
  y: Math.random() * rain.height,
  len: 10 + Math.random() * 20,
  speed: 4 + Math.random() * 8
}));

function drawRain(){
  rctx.clearRect(0, 0, rain.width, rain.height);
  rctx.strokeStyle = "rgba(0,200,255,0.8)";
  rctx.shadowBlur  = 8;
  rctx.shadowColor = "#00c8ff";
  for(const d of drops){
    rctx.beginPath();
    rctx.moveTo(d.x, d.y);
    rctx.lineTo(d.x, d.y + d.len);
    rctx.stroke();
    d.y += d.speed + beat * 4;
    d.x += -1 + beat * 1.5;
    if(d.y > rain.height){ d.y = 0; d.x = Math.random() * rain.width; }
  }
  requestAnimationFrame(drawRain);
}

/* ── FIRE ── */
const fire  = document.getElementById("fireCanvas");
const fctx  = fire.getContext("2d");
fitCanvas(fire);

const flameCount = isMobile ? 50 : 80; /* was 100 */
const flames = Array.from({ length: flameCount }, () => ({
  x: Math.random() * fire.width,
  y: fire.height + Math.random() * 200
}));

function drawFire(){
  fctx.clearRect(0, 0, fire.width, fire.height);
  for(const f of flames){
    const glow = 0.25 + beat * 0.6;
    const g = fctx.createRadialGradient(f.x, f.y, 2, f.x, f.y, 45);
    g.addColorStop(0, `rgba(0,200,255,${glow})`);
    g.addColorStop(0.5, "rgba(0,120,255,0.15)");
    g.addColorStop(1, "transparent");
    fctx.fillStyle = g;
    fctx.beginPath();
    fctx.arc(f.x, f.y, 40, 0, Math.PI * 2);
    fctx.fill();
    f.y -= 2 + beat * 6;
    if(f.y < -60){ f.y = fire.height + 60; f.x = Math.random() * fire.width; }
  }
  requestAnimationFrame(drawFire);
}

/* ── VORTEX ── */
const vortex = document.getElementById("vortexCanvas");
const vctx   = vortex.getContext("2d");
fitCanvas(vortex);

/* Only render vortex on desktop — too heavy for mobile */
function drawVortex(){
  vctx.clearRect(0, 0, vortex.width, vortex.height);
  const cx = vortex.width / 2;
  const cy = vortex.height / 2;
  const count = isMobile ? 20 : 40; /* was 40 always */
  for(let i = 0; i < count; i++){
    const angle  = (i / count) * Math.PI * 2 + Date.now() * 0.0004;
    const radius = 110 + Math.sin(Date.now() * 0.0015 + i) * 35;
    const x = cx + Math.cos(angle) * radius;
    const y = cy + Math.sin(angle) * radius;
    vctx.fillStyle  = "rgba(0,200,255,0.06)";
    vctx.shadowBlur = 15;
    vctx.shadowColor = "#00c8ff";
    vctx.beginPath();
    vctx.arc(x, y, 5, 0, Math.PI * 2);
    vctx.fill();
  }
  requestAnimationFrame(drawVortex);
}

/* Start all loops */
drawRain();
drawFire();
drawVortex();

/* Resize canvases on window resize */
window.addEventListener("resize", () => {
  fitCanvas(rain);
  fitCanvas(fire);
  fitCanvas(vortex);
}, { passive: true });
</script>

<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", () =>
    navigator.serviceWorker.register("/sw.js").catch(() => {})
  );
}
</script>

</body>
</html>
