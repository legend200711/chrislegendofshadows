<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chris Legend of Shadows — Gallery</title>

<!-- Web App Manifest -->
<link rel="manifest" href="manifest.json">
<!-- Preconnect to Firebase -->
<link rel="preconnect" href="https://www.gstatic.com">
<link rel="dns-prefetch" href="https://firebasestorage.googleapis.com">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  overflow-x: hidden;
  font-family: Arial, sans-serif;
  color: #cfefff;
  background: radial-gradient(circle at top, #050b18, #000);
}

/* DARK OVERLAY */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(circle, rgba(0,0,0,0.15), rgba(0,0,0,0.8));
  z-index: 0;
  pointer-events: none;
}

/* FLAME CANVAS */
#flameCanvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 1;
}

/* BLUE RAIN (CSS-only, 60 DOM nodes → 30 on mobile) */
.rain {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  overflow: hidden;
}

.drop {
  position: absolute;
  bottom: 100%;
  width: 2px;
  height: 80px;
  background: linear-gradient(to bottom, transparent, #00aaff);
  animation: fall linear infinite;
  opacity: 0.45;
}

@keyframes fall {
  to { transform: translateY(120vh); }
}

/* NAV */
nav {
  position: fixed;
  top: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 20px;
  padding: 14px;
  background: rgba(0,0,0,.5);
  backdrop-filter: blur(10px);
  z-index: 10;
  box-sizing: border-box;
}

nav a {
  color: #7fd3ff;
  text-decoration: none;
  font-weight: bold;
  padding: 8px 14px;
  border-radius: 20px;
}

nav a:hover {
  background: #00aaff;
  color: black;
  box-shadow: 0 0 12px #00aaff;
}

/* GALLERY */
.gallery {
  max-width: 1100px;
  margin: 120px auto 40px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  padding: 20px;
  position: relative;
  z-index: 5;
}

.gallery img {
  width: 100%;
  border-radius: 14px;
  border: 1px solid rgba(0,200,255,.25);
  /* Lazy loading — native, no JS needed */
  loading: lazy;
}

/* COMMENTS SYSTEM */
.container {
  max-width: 800px;
  margin: 40px auto;
  padding: 20px;
  position: relative;
  z-index: 5;
}

h1 {
  text-align: center;
  color: #00aaff;
  text-shadow: 0 0 15px #00aaff;
}

input, textarea {
  width: 100%;
  padding: 15px;
  margin: 10px 0;
  border: none;
  border-radius: 12px;
  background: #0a1a2b;
  color: white;
  font-size: 16px;
  outline: none;
  box-sizing: border-box;
}

textarea { height: 120px; resize: vertical; }

#sendBtn {
  background: #00aaff;
  color: black;
  border: none;
  padding: 14px 24px;
  border-radius: 30px;
  font-size: 18px;
  cursor: pointer;
  font-weight: bold;
  width: 100%;
}

#sendBtn:hover {
  box-shadow: 0 0 18px #00aaff;
}

.comment {
  margin-top: 15px;
  padding: 15px;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(0,170,255,.3);
  border-radius: 15px;
}

.comment strong { color: #00aaff; }

.deleteBtn {
  margin-top: 10px;
  background: red;
  color: white;
  border: none;
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  opacity: 0;
  transition: 0.2s;
}

.comment:hover .deleteBtn {
  opacity: 1;
}

#statusMsg {
  text-align: center;
  color: #00aaff;
  min-height: 20px;
  margin-top: 6px;
  font-size: 14px;
}
</style>
</head>

<body>

<canvas id="flameCanvas"></canvas>
<div class="rain" id="rain"></div>

<nav>
  <a href="index.html">Home</a>
  <a href="music.html">Music</a>
  <a href="about.html">About</a>
  <a href="chat room.html">Chat Room</a>
</nav>

<div class="gallery">
  <img src="samiam.png" alt="Sam I Am" loading="lazy">
  <img src="tam.png" alt="Tam" loading="lazy">
</div>

<div class="container">
  <h1>💙 Chris Legend of Shadows 💙</h1>

  <input id="nameInput" placeholder="Your name" maxlength="50">
  <textarea id="messageInput" placeholder="Write something positive..." maxlength="500"></textarea>
  <button id="sendBtn">Post Comment</button>
  <p id="statusMsg"></p>

  <div id="comments"></div>
</div>

<script>
const isMobile = window.innerWidth < 600;

/* BLUE RAIN */
const rain = document.getElementById("rain");
const dropCount = isMobile ? 30 : 60;
for(let i = 0; i < dropCount; i++){
  const drop = document.createElement("div");
  drop.className = "drop";
  drop.style.left = Math.random()*100 + "vw";
  drop.style.animationDuration = (0.5 + Math.random()*1.5) + "s";
  rain.appendChild(drop);
}

/* STORM FLAMES */
const flameCanvas = document.getElementById("flameCanvas");
const fctx = flameCanvas.getContext("2d");

function resize(){
  flameCanvas.width  = window.innerWidth;
  flameCanvas.height = window.innerHeight;
}
window.addEventListener("resize", resize, { passive: true });
resize();

const flameCount = isMobile ? 50 : 100; /* was 120 */

class Flame {
  constructor(){ this.reset(); }
  reset(){
    this.x      = Math.random() * flameCanvas.width;
    this.y      = flameCanvas.height + Math.random() * 100;
    this.size   = Math.random() * 6 + 2;
    this.speedY = Math.random() * 2 + 1;
    this.speedX = (Math.random() - 0.5) * 1.5;
    this.alpha  = Math.random() * 0.5 + 0.2;
    this.life   = Math.random() * 120;
  }
  update(){
    this.y -= this.speedY;
    this.x += this.speedX;
    this.life--;
    if(this.life <= 0 || this.y < -50) this.reset();
  }
  draw(){
    const g = fctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 2);
    g.addColorStop(0, `rgba(0,170,255,${this.alpha})`);
    g.addColorStop(1, "rgba(0,0,0,0)");
    fctx.fillStyle = g;
    fctx.beginPath();
    fctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
    fctx.fill();
  }
}

const flames = Array.from({ length: flameCount }, () => new Flame());

let lastFrame = 0;
function animate(ts){
  if(ts - lastFrame < (isMobile ? 33 : 16)){
    requestAnimationFrame(animate);
    return;
  }
  lastFrame = ts;
  fctx.fillStyle = "rgba(0,0,0,0.14)";
  fctx.fillRect(0, 0, flameCanvas.width, flameCanvas.height);
  flames.forEach(f => { f.update(); f.draw(); });
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>

<!-- Firebase — loaded as module, doesn't block rendering -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase, ref, push, onValue, remove
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAHwNhzonlsFbZFFrc1nvEqpl0ayM8N42c",
  authDomain: "bue12-f6a1f.firebaseapp.com",
  databaseURL: "https://bue12-f6a1f-default-rtdb.firebaseio.com",
  projectId: "bue12-f6a1f",
  storageBucket: "bue12-f6a1f.firebasestorage.app",
  messagingSenderId: "383513452214",
  appId: "1:383513452214:web:a86ee2969a3fc9e3459017"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);
const commentsRef = ref(db, "comments");

const statusMsg = document.getElementById("statusMsg");

/* POST */
document.getElementById("sendBtn").addEventListener("click", async () => {
  const name    = document.getElementById("nameInput").value.trim();
  const message = document.getElementById("messageInput").value.trim();

  if(!name || !message){
    statusMsg.textContent = "Please fill in both fields.";
    return;
  }

  document.getElementById("sendBtn").disabled = true;
  statusMsg.textContent = "Posting…";

  try {
    await push(commentsRef, { name, message, time: Date.now() });
    document.getElementById("messageInput").value = "";
    statusMsg.textContent = "✅ Comment posted!";
  } catch(e) {
    statusMsg.textContent = "❌ Failed to post. Check your connection.";
  } finally {
    document.getElementById("sendBtn").disabled = false;
  }
});

/* LOAD — build DOM safely, no innerHTML injection */
onValue(commentsRef, (snapshot) => {
  const data = snapshot.val();
  const box  = document.getElementById("comments");
  box.innerHTML = "";
  if(!data) return;

  Object.entries(data).reverse().forEach(([id, c]) => {
    const wrap = document.createElement("div");
    wrap.className = "comment";

    const name = document.createElement("strong");
    name.textContent = c.name;

    const msg = document.createElement("p");
    msg.textContent = c.message;

    const btn = document.createElement("button");
    btn.className = "deleteBtn";
    btn.textContent = "Delete";
    btn.addEventListener("click", async () => {
      if(!confirm("Delete this comment?")) return;
      try {
        await remove(ref(db, "comments/" + id));
      } catch(e) {
        alert("Could not delete. Try again.");
      }
    });

    wrap.appendChild(name);
    wrap.appendChild(msg);
    wrap.appendChild(btn);
    box.appendChild(wrap);
  });
});
</script>

<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", () =>
    navigator.serviceWorker.register("/sw.js").catch(() => {})
  );
}
</script>

</body>
</html>
