<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery | Chris Legend of Shadows</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://www.gstatic.com">
<link rel="dns-prefetch" href="https://firebasestorage.googleapis.com">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  min-height: 100%;
  overflow-x: hidden;
  font-family: 'Cinzel', Georgia, serif;
  color: #c0deff;
  background: #000;
}

/* ── SHADOW REALM BACKGROUND ── */
body::before {
  content: "";
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse at 50% -5%,  rgba(0,20,70,.9),  transparent 50%),
    radial-gradient(ellipse at 0%   60%, rgba(0,0,50,.8),   transparent 55%),
    radial-gradient(ellipse at 100% 60%, rgba(5,0,40,.8),   transparent 55%),
    radial-gradient(ellipse at 50% 110%,rgba(0,10,50,.9),   transparent 60%);
  z-index: -20;
  pointer-events: none;
}

/* ── CANVAS LAYERS ── */
#flameCanvas, #smokeCanvas {
  position: fixed; inset: 0;
  pointer-events: none;
}
#smokeCanvas { z-index: -12; }
#flameCanvas { z-index: -8; }

/* ── RAIN ── */
.rain { position: fixed; inset: 0; pointer-events: none; z-index: -6; overflow: hidden; }
.drop {
  position: absolute; bottom: 100%;
  width: 1px; height: 70px;
  background: linear-gradient(to bottom, transparent, rgba(0,140,255,.5));
  animation: fall linear infinite;
}
@keyframes fall { to { transform: translateY(115vh); } }

/* ── NAV ── */
nav {
  position: fixed;
  top: 0; width: 100%;
  display: flex; justify-content: center; flex-wrap: wrap;
  gap: 6px; padding: 12px 16px;
  background: rgba(0,0,10,.65);
  backdrop-filter: blur(14px);
  z-index: 100;
  border-bottom: 1px solid rgba(0,120,255,.2);
}
nav a {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 3px;
  color: rgba(130,190,255,.7);
  text-decoration: none;
  padding: 8px 16px;
  border-radius: 30px;
  border: 1px solid rgba(0,100,255,.2);
  background: rgba(0,0,20,.4);
  transition: .25s;
  text-transform: uppercase;
}
nav a:hover {
  color: #fff;
  background: rgba(0,70,180,.3);
  border-color: rgba(0,150,255,.5);
  box-shadow: 0 0 14px rgba(0,120,255,.4);
}

/* ── PAGE TITLE ── */
.pageTitle {
  text-align: center;
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(20px, 4vw, 36px);
  letter-spacing: 5px;
  color: #80c0ff;
  text-shadow: 0 0 20px rgba(0,120,255,.7), 0 0 50px rgba(0,60,180,.4);
  margin: 120px auto 30px;
  animation: titleGlow 5s ease-in-out infinite;
}
@keyframes titleGlow {
  0%,100% { text-shadow: 0 0 20px rgba(0,120,255,.7); }
  50%     { text-shadow: 0 0 40px rgba(0,180,255,.9), 0 0 80px rgba(0,100,255,.5); }
}

/* ── GALLERY GRID ── */
.gallery {
  max-width: 1100px;
  margin: 0 auto 40px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 24px;
  padding: 0 20px;
  position: relative; z-index: 5;
}

/* ── GALLERY CARD ── */
.galleryCard {
  position: relative;
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid rgba(0,120,255,.3);
  box-shadow: 0 0 20px rgba(0,80,200,.2), inset 0 0 20px rgba(0,20,60,.4);
  transition: .3s ease;
  background: rgba(0,10,30,.5);
}
.galleryCard::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(to right, transparent, rgba(0,160,255,.7), transparent);
  z-index: 2;
}
.galleryCard:hover {
  transform: translateY(-8px) scale(1.02);
  box-shadow: 0 0 40px rgba(0,140,255,.4), 0 0 80px rgba(0,80,200,.2);
  border-color: rgba(0,180,255,.5);
}
.galleryCard img {
  width: 100%;
  display: block;
  border-radius: 16px;
  filter: brightness(.85) contrast(1.1) saturate(.9);
  transition: filter .3s ease;
}
.galleryCard:hover img {
  filter: brightness(1) contrast(1.1) saturate(1.1);
}
/* Blue flame overlay on hover */
.galleryCard::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,60,180,.3) 0%, transparent 50%);
  border-radius: 16px;
  pointer-events: none;
}

/* ── COMMENTS PANEL ── */
.commentSection {
  max-width: 820px;
  margin: 0 auto 40px;
  padding: 0 20px;
  position: relative; z-index: 5;
}

.commentPanel {
  background: rgba(0,10,30,.55);
  border: 1px solid rgba(0,120,255,.25);
  border-radius: 18px;
  padding: 28px 30px;
  backdrop-filter: blur(14px);
  box-shadow: 0 0 25px rgba(0,80,200,.15), inset 0 0 30px rgba(0,20,60,.3);
  position: relative; overflow: hidden;
}
.commentPanel::before {
  content: "";
  position: absolute;
  top: 0; left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(to right, transparent, rgba(0,160,255,.5), transparent);
}
.commentPanel h2 {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(14px, 2.5vw, 20px);
  letter-spacing: 3px;
  color: #70b8ff;
  margin-bottom: 20px;
  text-shadow: 0 0 12px rgba(0,120,255,.5);
}

input, textarea {
  width: 100%;
  padding: 14px 18px;
  margin: 8px 0;
  border: 1px solid rgba(0,100,200,.3);
  border-radius: 12px;
  background: rgba(0,10,40,.6);
  color: #c0deff;
  font-family: 'Cinzel', serif;
  font-size: 13px;
  outline: none;
  backdrop-filter: blur(8px);
  transition: .25s;
}
input:focus, textarea:focus {
  border-color: rgba(0,160,255,.6);
  box-shadow: 0 0 14px rgba(0,120,255,.3);
}
textarea { height: 110px; resize: vertical; }

#sendBtn {
  background: linear-gradient(135deg, rgba(0,80,200,.7), rgba(0,40,120,.8));
  color: #a0d0ff;
  border: 1px solid rgba(0,140,255,.4);
  padding: 14px 28px;
  border-radius: 30px;
  font-family: 'Cinzel Decorative', serif;
  font-size: 13px;
  letter-spacing: 3px;
  cursor: pointer;
  width: 100%;
  transition: .25s;
  text-transform: uppercase;
  box-shadow: 0 0 20px rgba(0,80,200,.2);
  margin-top: 8px;
}
#sendBtn:hover {
  background: linear-gradient(135deg, rgba(0,120,255,.8), rgba(0,60,180,.9));
  box-shadow: 0 0 30px rgba(0,140,255,.6), 0 0 60px rgba(0,80,200,.3);
  color: #fff;
  border-color: rgba(0,200,255,.6);
}

.comment {
  margin-top: 16px;
  padding: 16px 20px;
  background: rgba(0,15,40,.5);
  border: 1px solid rgba(0,100,200,.2);
  border-radius: 14px;
  backdrop-filter: blur(8px);
  transition: .2s;
}
.comment:hover { border-color: rgba(0,140,255,.35); }
.comment strong { color: #60b0ff; font-size: 13px; letter-spacing: 1px; }
.comment p { color: #90b8d8; font-size: 13px; margin-top: 6px; line-height: 1.7; font-family: Arial, sans-serif; }

.deleteBtn {
  margin-top: 10px;
  background: rgba(120,20,20,.6);
  color: rgba(255,150,150,.8);
  border: 1px solid rgba(200,50,50,.3);
  padding: 5px 12px;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
  opacity: 0;
  transition: .2s;
}
.comment:hover .deleteBtn { opacity: 1; }
@media (pointer: coarse) { .deleteBtn { opacity: .7; } }

#statusMsg {
  text-align: center;
  color: #60b0ff;
  min-height: 20px;
  margin-top: 8px;
  font-size: 13px;
  letter-spacing: 1px;
}

/* ── STAY LEGENDARY FOOTER ── */
.legendFooter {
  text-align: center;
  padding: 30px 20px 40px;
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(11px, 2vw, 14px);
  letter-spacing: 6px;
  color: rgba(80,160,255,.5);
  text-transform: uppercase;
  animation: footerPulse 5s ease-in-out infinite;
  position: relative; z-index: 5;
}
@keyframes footerPulse {
  0%,100% { opacity: .5; }
  50%     { opacity: 1; text-shadow: 0 0 20px rgba(0,120,255,.5); }
}
</style>
</head>
<body>

<canvas id="smokeCanvas"></canvas>
<canvas id="flameCanvas"></canvas>
<div class="rain" id="rain"></div>

<nav>
  <a href="index.html">Home</a>
  <a href="music.html">Music</a>
  <a href="about.html">About</a>
</nav>

<h1 class="pageTitle">SHADOW GALLERY</h1>

<div class="gallery">
  <div class="galleryCard">
    <img src="samiam.png" alt="Sam I Am" loading="lazy">
  </div>
  <div class="galleryCard">
    <img src="tam.png" alt="Tam" loading="lazy">
  </div>
</div>

<div class="commentSection">
  <div class="commentPanel">
    <h2>☽ Leave a Message in the Shadows</h2>
    <input id="nameInput" placeholder="Your name" maxlength="50">
    <textarea id="messageInput" placeholder="Write something to the Legend..." maxlength="500"></textarea>
    <button id="sendBtn">⚔ Send to the Shadow Realm</button>
    <p id="statusMsg"></p>
    <div id="comments"></div>
  </div>
</div>

<div class="legendFooter">⚔ Stay Legendary ⚔</div>

<script>
const isMobile = window.innerWidth < 600;
const W = () => innerWidth, H = () => innerHeight;
function fitCanvas(c){ c.width = W(); c.height = H(); }

/* ── RAIN ── */
const rain = document.getElementById("rain");
const dropCount = isMobile ? 30 : 60;
for(let i = 0; i < dropCount; i++){
  const d = document.createElement("div");
  d.className = "drop";
  d.style.left = Math.random()*100 + "vw";
  d.style.animationDuration = (.6 + Math.random()*1.4) + "s";
  d.style.animationDelay = (Math.random()*2) + "s";
  rain.appendChild(d);
}

/* ── SMOKE ── */
const smokeC = document.getElementById("smokeCanvas");
const mctx = smokeC.getContext("2d");
fitCanvas(smokeC);
const smokePs = Array.from({ length: isMobile ? 22 : 50 }, () => ({
  x: Math.random()*W(), y: H()+Math.random()*100,
  r: 25+Math.random()*70, vy: -(0.2+Math.random()*.6),
  vx: (Math.random()-.5)*.4, alpha: .025+Math.random()*.06,
  life: Math.random()*180
}));
function drawSmoke(){
  mctx.clearRect(0,0,W(),H());
  for(const p of smokePs){
    const g = mctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
    g.addColorStop(0,`rgba(8,25,70,${p.alpha})`);
    g.addColorStop(1,"transparent");
    mctx.fillStyle=g; mctx.beginPath(); mctx.arc(p.x,p.y,p.r,0,Math.PI*2); mctx.fill();
    p.x+=p.vx; p.y+=p.vy; p.life--;
    if(p.life<=0||p.y<-p.r*2){ p.x=Math.random()*W(); p.y=H()+p.r; p.life=130+Math.random()*150; }
  }
  requestAnimationFrame(drawSmoke);
}
drawSmoke();

/* ── BLUE FLAMES ── */
const flameC = document.getElementById("flameCanvas");
const fctx = flameC.getContext("2d");
fitCanvas(flameC);
const flames = Array.from({ length: isMobile ? 45 : 90 }, () => ({
  x: Math.random()*W(), y: H()+Math.random()*60,
  s: 2+Math.random()*7, vy: .8+Math.random()*2,
  vx: (Math.random()-.5)*1.1, alpha: .15+Math.random()*.4,
  hue: 195+Math.random()*35
}));
let lastF = 0;
function drawFlames(ts){
  if(ts-lastF<(isMobile?33:16)){ requestAnimationFrame(drawFlames); return; }
  lastF=ts;
  fctx.fillStyle="rgba(0,0,0,.14)"; fctx.fillRect(0,0,W(),H());
  for(const f of flames){
    const g=fctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.s*3);
    g.addColorStop(0,`hsla(${f.hue},100%,65%,${f.alpha})`);
    g.addColorStop(.6,`hsla(${f.hue},100%,45%,${f.alpha*.3})`);
    g.addColorStop(1,"transparent");
    fctx.fillStyle=g; fctx.beginPath(); fctx.arc(f.x,f.y,f.s*3,0,Math.PI*2); fctx.fill();
    f.x+=f.vx; f.y-=f.vy;
    if(f.y<-60){ f.y=H()+60; f.x=Math.random()*W(); }
  }
  requestAnimationFrame(drawFlames);
}
requestAnimationFrame(drawFlames);

window.addEventListener("resize", ()=>{ fitCanvas(smokeC); fitCanvas(flameC); }, { passive:true });
</script>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAHwNhzonlsFbZFFrc1nvEqpl0ayM8N42c",
  authDomain: "bue12-f6a1f.firebaseapp.com",
  databaseURL: "https://bue12-f6a1f-default-rtdb.firebaseio.com",
  projectId: "bue12-f6a1f",
  storageBucket: "bue12-f6a1f.firebasestorage.app",
  messagingSenderId: "383513452214",
  appId: "1:383513452214:web:a86ee2969a3fc9e3459017"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);
const commentsRef = ref(db, "comments");
const statusMsg = document.getElementById("statusMsg");

document.getElementById("sendBtn").addEventListener("click", async () => {
  const name    = document.getElementById("nameInput").value.trim();
  const message = document.getElementById("messageInput").value.trim();
  if(!name || !message){ statusMsg.textContent = "Please fill in both fields."; return; }
  document.getElementById("sendBtn").disabled = true;
  statusMsg.textContent = "Sending to the shadows…";
  try {
    await push(commentsRef, { name, message, time: Date.now() });
    document.getElementById("messageInput").value = "";
    statusMsg.textContent = "✦ Message received by the shadows!";
  } catch(e) {
    statusMsg.textContent = "⚠ Failed to send. Check your connection.";
  } finally {
    document.getElementById("sendBtn").disabled = false;
  }
});

onValue(commentsRef, (snapshot) => {
  const data = snapshot.val();
  const box  = document.getElementById("comments");
  box.innerHTML = "";
  if(!data) return;
  Object.entries(data).reverse().forEach(([id, c]) => {
    const wrap = document.createElement("div");
    wrap.className = "comment";
    const name = document.createElement("strong");
    name.textContent = c.name;
    const msg = document.createElement("p");
    msg.textContent = c.message;
    const btn = document.createElement("button");
    btn.className = "deleteBtn";
    btn.textContent = "Delete";
    btn.addEventListener("click", async () => {
      if(!confirm("Delete this comment?")) return;
      try { await remove(ref(db, "comments/" + id)); }
      catch(e) { alert("Could not delete. Try again."); }
    });
    wrap.appendChild(name); wrap.appendChild(msg); wrap.appendChild(btn);
    box.appendChild(wrap);
  });
});
</script>

<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", () =>
    navigator.serviceWorker.register("/sw.js").catch(() => {})
  );
}
</script>
</body>
