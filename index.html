<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chris Legend of Shadows</title>
<meta name="description" content="Enter the Shadow Realm — Music, Gallery & more from Chris Legend of Shadows. Stay Legendary.">
<meta name="theme-color" content="#000510">

<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<!-- Open Graph -->
<meta property="og:title" content="Chris Legend of Shadows">
<meta property="og:description" content="Enter the Shadow Realm. Stay Legendary.">

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  font-family: 'Cinzel', Georgia, serif;
  color: #c8e8ff;
  cursor: none;
}

/* ── DEEP SHADOW REALM BACKGROUND ── */
body::before {
  content: "";
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse at 50% 0%,   rgba(0,30,80,.7),   transparent 55%),
    radial-gradient(ellipse at 20% 100%, rgba(0,0,40,.9),    transparent 60%),
    radial-gradient(ellipse at 80% 100%, rgba(10,0,30,.8),   transparent 60%),
    radial-gradient(ellipse at 50% 50%,  rgba(0,5,20,1),     transparent 80%);
  z-index: -20;
}

/* ── MOONLIGHT BEAM ── */
body::after {
  content: "";
  position: fixed;
  top: -10%; left: 50%;
  transform: translateX(-50%);
  width: 300px; height: 80vh;
  background: linear-gradient(to bottom, rgba(100,180,255,.12), transparent 80%);
  clip-path: polygon(35% 0%, 65% 0%, 100% 100%, 0% 100%);
  pointer-events: none;
  z-index: -5;
  animation: moonBeam 8s ease-in-out infinite;
}
@keyframes moonBeam {
  0%,100% { opacity: .5; transform: translateX(-50%) scaleX(1); }
  50%     { opacity: .9; transform: translateX(-50%) scaleX(1.15); }
}

/* ── CANVAS LAYERS ── */
#shadowCanvas, #smokeCanvas, #flameCanvas {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}
#shadowCanvas { z-index: -15; }
#smokeCanvas  { z-index: -12; }
#flameCanvas  { z-index: -8; }

/* ── CUSTOM CURSOR ── */
#cursor {
  position: fixed;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: rgba(0,160,255,.8);
  box-shadow: 0 0 14px #00a0ff, 0 0 28px rgba(0,100,255,.5);
  pointer-events: none;
  transform: translate(-50%,-50%);
  display: none;
  z-index: 9999;
  transition: transform .08s ease;
}
@media (pointer: fine) { #cursor { display: block; } }

/* ── MOON ── */
#moon {
  position: fixed;
  top: 5%; left: 50%;
  transform: translateX(-50%);
  width: 110px; height: 110px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #d8f0ff, #7ab8e8 55%, #1a3a6a);
  box-shadow:
    0 0 40px rgba(100,180,255,.5),
    0 0 80px rgba(50,120,255,.3),
    0 0 140px rgba(0,60,180,.2);
  z-index: 2;
  animation: moonGlow 5s ease-in-out infinite;
}
#moon::after {
  content: "";
  position: absolute; inset: -8px;
  border-radius: 50%;
  border: 1px solid rgba(120,200,255,.3);
  box-shadow: 0 0 30px rgba(100,200,255,.2);
  animation: moonRing 4s linear infinite;
}
@keyframes moonGlow {
  0%,100% { box-shadow: 0 0 40px rgba(100,180,255,.5), 0 0 80px rgba(50,120,255,.3); }
  50%     { box-shadow: 0 0 70px rgba(100,200,255,.7), 0 0 130px rgba(50,150,255,.5); }
}
@keyframes moonRing {
  0%   { transform: scale(1);   opacity: .6; }
  50%  { transform: scale(1.1); opacity: 1; }
  100% { transform: scale(1);   opacity: .6; }
}

/* ── TITLE ── */
#titleWrap {
  position: fixed;
  top: 18%;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  z-index: 10;
  pointer-events: none;
  width: 90%;
}
#titleWrap h1 {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(22px, 5vw, 52px);
  font-weight: 900;
  letter-spacing: 6px;
  color: #a8d8ff;
  text-shadow:
    0 0 10px #00a0ff,
    0 0 30px rgba(0,120,255,.7),
    0 0 60px rgba(0,60,180,.5);
  animation: titleShimmer 6s ease-in-out infinite;
}
#titleWrap .tagline {
  font-size: clamp(11px, 2vw, 16px);
  letter-spacing: 8px;
  color: rgba(160,200,255,.5);
  margin-top: 8px;
  text-transform: uppercase;
}
@keyframes titleShimmer {
  0%,100% { text-shadow: 0 0 10px #00a0ff, 0 0 30px rgba(0,120,255,.7); }
  50%     { text-shadow: 0 0 20px #40c0ff, 0 0 50px rgba(0,150,255,.9), 0 0 90px rgba(0,80,220,.6); }
}

/* ── REAPER SIGIL (center core) ── */
#sigil {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  width: 200px; height: 200px;
  z-index: 5;
  animation: sigilPulse 3s ease-in-out infinite;
}
#sigil svg { width: 100%; height: 100%; }
@keyframes sigilPulse {
  0%,100% { filter: drop-shadow(0 0 8px #0080ff) drop-shadow(0 0 20px rgba(0,80,200,.5)); transform: translate(-50%,-50%) scale(1); }
  50%     { filter: drop-shadow(0 0 18px #40c0ff) drop-shadow(0 0 40px rgba(0,120,255,.8)); transform: translate(-50%,-50%) scale(1.06); }
}

/* ── ORBITAL PORTALS ── */
.orbitWrap {
  position: fixed;
  top: 50%; left: 50%;
  width: 0; height: 0;
  animation: orbit 16s linear infinite;
  transform-origin: center;
  z-index: 8;
  will-change: transform;
}
@keyframes orbit { to { transform: rotate(360deg); } }

.node { position: absolute; top: 0; left: 0; }
#aboutNode   { transform: rotate(0deg)   translateX(260px); }
#galleryNode { transform: rotate(120deg) translateX(260px); }
#musicNode   { transform: rotate(240deg) translateX(260px); }

.portal {
  position: absolute;
  width: 130px; height: 130px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  text-align: center;
  color: #b0d8ff;
  text-decoration: none;
  font-family: 'Cinzel Decorative', serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  background: radial-gradient(circle, rgba(0,40,80,.6), rgba(0,0,20,.8));
  border: 1px solid rgba(0,160,255,.4);
  box-shadow:
    0 0 20px rgba(0,120,255,.25),
    inset 0 0 20px rgba(0,80,200,.15);
  backdrop-filter: blur(8px);
  transition: .25s ease;
  counter-reset: none;
}
.portal::before {
  content: "";
  position: absolute; inset: -4px;
  border-radius: 50%;
  border: 1px solid rgba(0,160,255,.2);
  animation: portalRing 3s linear infinite;
}
@keyframes portalRing {
  from { transform: rotate(0deg) scale(1); opacity: .6; }
  to   { transform: rotate(360deg) scale(1); opacity: .6; }
}
.portal:hover {
  transform: scale(1.3);
  background: radial-gradient(circle, rgba(0,80,160,.7), rgba(0,0,40,.9));
  box-shadow:
    0 0 40px rgba(0,160,255,.7),
    0 0 80px rgba(0,80,200,.4),
    inset 0 0 30px rgba(0,120,255,.3);
  color: #fff;
  border-color: rgba(0,200,255,.8);
}

/* ── STAY LEGENDARY BADGE ── */
#legendBadge {
  position: fixed;
  bottom: 24px; left: 50%;
  transform: translateX(-50%);
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(10px, 2vw, 14px);
  letter-spacing: 5px;
  color: rgba(100,180,255,.6);
  text-transform: uppercase;
  z-index: 20;
  text-shadow: 0 0 10px rgba(0,120,255,.5);
  animation: badgePulse 5s ease-in-out infinite;
}
@keyframes badgePulse {
  0%,100% { opacity: .5; }
  50%     { opacity: 1; text-shadow: 0 0 20px rgba(0,160,255,.8); }
}

/* ── RESPONSIVE ── */
@media (max-width: 900px) {
  #aboutNode   { transform: rotate(0deg)   translateX(200px); }
  #galleryNode { transform: rotate(120deg) translateX(200px); }
  #musicNode   { transform: rotate(240deg) translateX(200px); }
  .portal { width: 110px; height: 110px; }
  #sigil  { width: 160px; height: 160px; }
}
@media (max-width: 600px) {
  #aboutNode   { transform: rotate(0deg)   translateX(120px); }
  #galleryNode { transform: rotate(120deg) translateX(120px); }
  #musicNode   { transform: rotate(240deg) translateX(120px); }
  .portal { width: 80px; height: 80px; font-size: 9px; }
  #sigil  { width: 110px; height: 110px; }
  #moon   { width: 70px; height: 70px; top: 3%; }
  #titleWrap { top: 15%; }
}
</style>
</head>
<body>

<!-- Background canvases -->
<canvas id="shadowCanvas"></canvas>
<canvas id="smokeCanvas"></canvas>
<canvas id="flameCanvas"></canvas>

<!-- Moon -->
<div id="moon"></div>

<!-- Title -->
<div id="titleWrap">
  <h1>CHRIS LEGEND OF SHADOWS</h1>
  <div class="tagline">Enter the Shadow Realm</div>
</div>

<!-- Reaper Sigil SVG -->
<div id="sigil">
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Outer glow ring -->
    <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(0,120,255,0.3)" stroke-width="1"/>
    <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(0,160,255,0.15)" stroke-width="0.5"/>
    <!-- Inner dark circle -->
    <circle cx="100" cy="100" r="75" fill="rgba(0,5,20,0.7)"/>
    <!-- Reaper scythe silhouette (simplified) -->
    <g fill="none" stroke="rgba(0,160,255,0.7)" stroke-width="1.5" stroke-linecap="round">
      <!-- Staff -->
      <line x1="100" y1="45" x2="100" y2="158"/>
      <!-- Blade arc -->
      <path d="M100,55 Q148,60 142,95 Q138,112 100,110"/>
      <!-- Blade tip -->
      <path d="M142,95 Q148,80 130,60 Q115,48 100,55"/>
      <!-- Runes -->
      <line x1="78"  y1="80"  x2="88"  y2="80"/>
      <line x1="83"  y1="75"  x2="83"  y2="85"/>
      <line x1="78"  y1="120" x2="88"  y2="120"/>
      <line x1="78"  y1="120" x2="83"  y2="130"/>
      <line x1="88"  y1="120" x2="83"  y2="130"/>
    </g>
    <!-- Glowing center dot -->
    <circle cx="100" cy="100" r="5" fill="rgba(0,180,255,0.8)">
      <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Orbit ring ticks -->
    <g stroke="rgba(0,140,255,0.4)" stroke-width="1">
      <line x1="100" y1="18" x2="100" y2="26"/>
      <line x1="100" y1="174" x2="100" y2="182"/>
      <line x1="18"  y1="100" x2="26"  y2="100"/>
      <line x1="174" y1="100" x2="182" y2="100"/>
      <line x1="37"  y1="37"  x2="43"  y2="43"/>
      <line x1="157" y1="157" x2="163" y2="163"/>
      <line x1="157" y1="37"  x2="163" y2="43"/>
      <line x1="37"  y1="157" x2="43"  y2="163"/>
    </g>
  </svg>
</div>

<!-- Orbital navigation -->
<div class="orbitWrap">
  <div class="node" id="aboutNode">
    <a href="about.html" class="portal">ABOUT</a>
  </div>
  <div class="node" id="galleryNode">
    <a href="gallery.html" class="portal">GALLERY</a>
  </div>
  <div class="node" id="musicNode">
    <a href="music.html" class="portal">MUSIC</a>
  </div>
</div>

<!-- Stay Legendary branding -->
<div id="legendBadge">⚔ Stay Legendary ⚔</div>

<!-- Custom cursor -->
<div id="cursor"></div>

<script>
/* ── CURSOR ── */
if(window.matchMedia("(pointer: fine)").matches){
  const cur = document.getElementById("cursor");
  document.addEventListener("mousemove", e => {
    cur.style.left = e.clientX + "px";
    cur.style.top  = e.clientY + "px";
  }, { passive: true });
}

const isMobile = window.innerWidth < 600;
const W = () => innerWidth, H = () => innerHeight;

function fitCanvas(c){ c.width = W(); c.height = H(); }

/* ── SHADOW STREAKS (animated shadows across the bg) ── */
const shadowC = document.getElementById("shadowCanvas");
const sctx = shadowC.getContext("2d");
fitCanvas(shadowC);

const shadowCount = isMobile ? 8 : 16;
const shadowStreaks = Array.from({ length: shadowCount }, () => ({
  x: Math.random() * W(),
  y: Math.random() * H(),
  w: 60 + Math.random() * 200,
  h: 4 + Math.random() * 12,
  speed: 0.3 + Math.random() * 0.8,
  alpha: 0.03 + Math.random() * 0.08,
  angle: -0.1 + Math.random() * 0.2
}));

function drawShadows(){
  sctx.clearRect(0, 0, W(), H());
  for(const s of shadowStreaks){
    sctx.save();
    sctx.translate(s.x, s.y);
    sctx.rotate(s.angle);
    const g = sctx.createLinearGradient(-s.w/2, 0, s.w/2, 0);
    g.addColorStop(0, "transparent");
    g.addColorStop(0.5, `rgba(0,60,180,${s.alpha})`);
    g.addColorStop(1, "transparent");
    sctx.fillStyle = g;
    sctx.fillRect(-s.w/2, -s.h/2, s.w, s.h);
    sctx.restore();
    s.x += s.speed;
    if(s.x > W() + s.w) s.x = -s.w;
  }
  requestAnimationFrame(drawShadows);
}

/* ── SMOKE PARTICLES ── */
const smokeC = document.getElementById("smokeCanvas");
const mctx = smokeC.getContext("2d");
fitCanvas(smokeC);

const smokeCount = isMobile ? 30 : 60;
const smokeParticles = Array.from({ length: smokeCount }, () => ({
  x: Math.random() * W(),
  y: H() + Math.random() * 100,
  r: 20 + Math.random() * 60,
  vy: -(0.3 + Math.random() * 0.8),
  vx: (Math.random() - 0.5) * 0.5,
  alpha: 0.04 + Math.random() * 0.08,
  life: Math.random() * 200
}));

function drawSmoke(ts){
  mctx.clearRect(0, 0, W(), H());
  for(const p of smokeParticles){
    const g = mctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
    g.addColorStop(0, `rgba(20,40,100,${p.alpha})`);
    g.addColorStop(1, "transparent");
    mctx.fillStyle = g;
    mctx.beginPath();
    mctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    mctx.fill();
    p.x += p.vx; p.y += p.vy; p.life--;
    if(p.life <= 0 || p.y < -p.r*2){
      p.x = Math.random() * W();
      p.y = H() + p.r;
      p.life = 150 + Math.random() * 150;
    }
  }
  requestAnimationFrame(drawSmoke);
}

/* ── BLUE FLAMES ── */
const flameC = document.getElementById("flameCanvas");
const fctx = flameC.getContext("2d");
fitCanvas(flameC);

const flameCount = isMobile ? 50 : 100;
const flames = Array.from({ length: flameCount }, () => ({
  x: Math.random() * W(),
  y: H() + Math.random() * 60,
  s: 3 + Math.random() * 8,
  vy: 1 + Math.random() * 2.5,
  vx: (Math.random() - 0.5) * 1.2,
  alpha: 0.2 + Math.random() * 0.5,
  hue: 190 + Math.random() * 40
}));

let lastF = 0;
function drawFlames(ts){
  if(ts - lastF < (isMobile ? 33 : 16)){ requestAnimationFrame(drawFlames); return; }
  lastF = ts;
  fctx.fillStyle = "rgba(0,0,0,0.18)";
  fctx.fillRect(0, 0, W(), H());
  for(const f of flames){
    const g = fctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.s * 3);
    g.addColorStop(0, `hsla(${f.hue},100%,70%,${f.alpha})`);
    g.addColorStop(0.5, `hsla(${f.hue},100%,50%,${f.alpha*0.4})`);
    g.addColorStop(1, "transparent");
    fctx.fillStyle = g;
    fctx.beginPath();
    fctx.arc(f.x, f.y, f.s * 3, 0, Math.PI*2);
    fctx.fill();
    f.x += f.vx; f.y -= f.vy;
    if(f.y < -60){ f.y = H() + 60; f.x = Math.random() * W(); }
  }
  requestAnimationFrame(drawFlames);
}

/* start loops */
drawShadows();
drawSmoke();
requestAnimationFrame(drawFlames);

window.addEventListener("resize", () => {
  fitCanvas(shadowC); fitCanvas(smokeC); fitCanvas(flameC);
}, { passive: true });

/* ── AUTO FIT (same as before) ── */
function autoFit(){
  const scale = Math.max(0.6, Math.min(Math.min(W()/420, H()/800), 1));
  document.body.style.transform = `scale(${scale})`;
  document.body.style.width  = (100/scale) + "%";
  document.body.style.height = (100/scale) + "%";
}
window.addEventListener("resize", autoFit, { passive: true });
autoFit();
</script>

</body>
