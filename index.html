<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Legend Chat Pro - Storm Mode</title>

<meta name="theme-color" content="#001a2a">

<style>

/* 🌌 GLOBAL RESET */
html, body{
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;
    font-family:Arial;
    color:white;
    background:#000a14;
}

/* 🐺 BACKGROUND */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:url("wolf.png");
    background-size:cover;
    background-position:center;
    z-index:-3;
    filter:brightness(0.7) contrast(1.1);
}

/* 🌧 RAIN CANVAS */
#rainCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:9999;
    pointer-events:none;
    mix-blend-mode:screen;
    opacity:0.75;
}

/* 🔥 FLAME LAYER */
#flameLayer{
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;
    background:radial-gradient(circle at bottom,
        rgba(0,170,255,0.25),
        rgba(0,80,255,0.08),
        transparent 70%);
    filter:blur(2px);
    animation:flameFlicker 2s infinite alternate;
}

/* ✨ FLAME ANIMATION */
@keyframes flameFlicker{
    0%{opacity:0.6; transform:scale(1);}
    100%{opacity:1; transform:scale(1.02);}
}

/* 🧭 HEADER */
header{
    position:relative;
    z-index:2;
    text-align:center;
    padding:12px;
    font-weight:bold;
    background:rgba(0,30,40,0.7);
    border-bottom:1px solid rgba(0,255,200,0.4);
    backdrop-filter: blur(6px);
}

/* 🧊 ROOM SCREEN */
#roomScreen{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.9);
    z-index:999;
}

/* ✍️ INPUTS */
#roomScreen input{
    padding:12px;
    border-radius:10px;
    border:none;
    margin-top:10px;
    background:#001a2a;
    color:white;
    text-align:center;
}

/* 🚪 BUTTONS */
#roomScreen button{
    margin-top:10px;
    padding:12px 18px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#00aaff,#00ffaa);
    font-weight:bold;
}

/* 💬 CHAT */
#chat{
    position:relative;
    z-index:2;
    height:calc(100vh - 140px);
    overflow-y:auto;
    padding:12px;
}

/* 📩 MESSAGE */
.msg{
    background:linear-gradient(145deg,#001a2a,#002b3a,#001018);
    padding:12px;
    margin-bottom:10px;
    border-radius:14px;
    border:1px solid rgba(0,170,255,0.25);
    word-break:break-word;
}

/* ⚡ REACTIONS */
.reactions{
    margin-top:8px;
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

/* 😄 BUTTONS */
.reactions button{
    font-size:14px;
    padding:4px 8px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    background:rgba(0,170,255,0.15);
    color:white;
}

/* 📊 COUNT */
.reaction-count{
    font-size:12px;
    margin-left:4px;
}

/* ⌨️ INPUT BAR */
.bottom{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    display:flex;
    gap:8px;
    padding:10px;
    background:rgba(0,20,30,0.75);
    z-index:3;
    backdrop-filter: blur(8px);
}

/* 🧾 INPUTS */
.bottom input{
    border:none;
    padding:12px;
    border-radius:10px;
    outline:none;
    background:#001a2a;
    color:white;
}

/* 👤 NAME */
#name{ width:90px; }

/* ✉️ MESSAGE */
#message{ flex:1; }

/* 🚀 BUTTON */
button{
    padding:12px 14px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#00aaff,#00ffaa);
    font-weight:bold;
}

/* 💥 EMOJI BURST ANIMATION */
@keyframes emojiPop {
    0% { transform: translateY(0) scale(0.6); opacity: 1; }
    100% { transform: translateY(-40px) scale(1.4); opacity: 0; }
}

.emoji-float {
    position: absolute;
    font-size: 22px;
    animation: emojiPop 800ms ease-out forwards;
    pointer-events: none;
    z-index: 99999;
}


#emojiPicker{position:fixed;bottom:70px;left:10px;right:10px;display:none;flex-wrap:wrap;gap:6px;padding:10px;background:rgba(0,20,35,.95);border:1px solid rgba(0,170,255,.35);border-radius:12px;max-height:180px;overflow-y:auto;z-index:9999}
#emojiPicker span{font-size:28px;cursor:pointer}
#emojiBtn{width:52px;font-size:22px}

</style>

</head>

<body>

<canvas id="rainCanvas"></canvas>
<div id="flameLayer"></div>

<div id="roomScreen">
    <h2>💀 Enter Room Code</h2>
    <input id="roomInput" placeholder="ROOM123">
    <input id="nameInput" placeholder="Your Name">
    <button onclick="joinRoom()">Join Room</button>
    <button onclick="joinLobby()">Enter Lobby</button>
</div>

<header id="roomTitle">💀 Legend Chat Pro 💀 | 👥 Online: 0</header>

<div id="chat"></div>

<div class="bottom">
    <input id="name" placeholder="Name">
    <input id="message" placeholder="Message">
    <button id="emojiBtn" type="button">😊</button>
    <button onclick="sendMessage()">Send</button>
</div>

<div id="emojiPicker"></div>

<script>

/* 🌧 RAIN SYSTEM */
const canvas = document.getElementById("rainCanvas");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const drops = Array.from({length: 120}, () => ({
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    len: Math.random() * 20 + 10,
    speed: Math.random() * 6 + 4
}));

function drawRain(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = "rgba(0,170,255,0.6)";
    ctx.lineWidth = 1;

    for (let d of drops){
        ctx.beginPath();
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x, d.y + d.len);
        ctx.stroke();

        d.y += d.speed;

        if (d.y > canvas.height){
            d.y = -20;
            d.x = Math.random() * canvas.width;
        }
    }

    requestAnimationFrame(drawRain);
}
drawRain();

/* 💥 EMOJI SYSTEM */
function spawnEmoji(x, y, emoji){
    const el = document.createElement("div");
    el.className = "emoji-float";
    el.textContent = emoji;

    el.style.left = x + "px";
    el.style.top = y + "px";

    document.body.appendChild(el);

    setTimeout(() => el.remove(), 800);
}


const picker=document.getElementById("emojiPicker");
const emojiBtn=document.getElementById("emojiBtn");
const messageBox=document.getElementById("message");
if(picker&&emojiBtn&&messageBox){
const emojis=["😀","😁","😂","🤣","😊","😍","😘","🥰","😎","🤩","🥳","😭","😡","🤯","😱","👍","👏","🙌","🙏","❤️","🔥","💀","⚡","✨","🎉","🎵","🚀","🐺"];
emojis.forEach(e=>{let s=document.createElement("span");s.textContent=e;s.onclick=()=>{messageBox.value+=e;messageBox.focus();};picker.appendChild(s);});
emojiBtn.onclick=(ev)=>{ev.stopPropagation();picker.style.display=picker.style.display==="flex"?"none":"flex";};
document.addEventListener("click",e=>{if(!picker.contains(e.target)&&e.target!==emojiBtn)picker.style.display="none";});
}

</script>

<script type="module">

/* ⚡ FIREBASE */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import {
  getDatabase, ref, push, onChildAdded,
  remove, set, onDisconnect, onValue,
  off
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAOnAtWJ...",
  authDomain: "legend-chat-246fd.firebaseapp.com",
  databaseURL: "https://legend-chat-246fd-default-rtdb.firebaseio.com",
  projectId: "legend-chat-246fd",
  storageBucket: "legend-chat-246fd.firebasestorage.app",
  messagingSenderId: "365662264136",
  appId: "1:365662264136:web:1c7cfb6db3f09a6fa1f17d"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let chatRef = null;
let presenceRef = null;
let presenceListenerRef = null;
let currentRoom = null;

let userId = crypto.randomUUID();

/* 🚪 JOIN */
window.joinRoom = function(){
    const room = document.getElementById("roomInput").value.trim().toUpperCase();
    const name = document.getElementById("nameInput").value.trim() || "Ghost";
    if(!room) return;
    enterRoom(room, name);
};

window.joinLobby = function(){
    const name = document.getElementById("nameInput").value.trim() || "Ghost";
    enterRoom("LOBBY", name);
};

function enterRoom(room, name){

    if(chatRef) off(chatRef);
    if(presenceListenerRef) off(presenceListenerRef);

    currentRoom = room;

    document.getElementById("roomScreen").style.display = "none";
    document.getElementById("chat").innerHTML = "";

    document.getElementById("name").value = name;

    document.getElementById("roomTitle").innerText =
        `💀 Room: ${room} | 👥 Online: 0`;

    chatRef = ref(db, "rooms/" + room + "/messages");

    setupPresence(room, name);
    listenMessages();
}

/* 👥 PRESENCE */
function setupPresence(room, name){
    presenceRef = ref(db, `rooms/${room}/presence/${userId}`);

    set(presenceRef, { name, online: true });
    onDisconnect(presenceRef).remove();

    presenceListenerRef = ref(db, `rooms/${room}/presence`);

    onValue(presenceListenerRef, (snap)=>{
        const data = snap.val() || {};
        const count = Object.keys(data).length;

        document.getElementById("roomTitle").innerText =
        `💀 Room: ${room} | 👥 Online: ${count}`;
    });
}

/* 💬 MESSAGES */
function listenMessages(){

    onChildAdded(chatRef, (snap)=>{

        const d = snap.val();
        const msgId = snap.key;

        const div = document.createElement("div");
        div.className = "msg";
        div.innerHTML = `<b>${escapeHtml(d.name)}</b><br>${escapeHtml(d.message)}`;

        const box = document.createElement("div");
        box.className = "reactions";

        ["😄","🔥","💀","❤️","⚡"].forEach(emo=>{

            const btn = document.createElement("button");
            const count = document.createElement("span");
            count.className = "reaction-count";
            count.textContent = "0";

            btn.textContent = emo + " ";

            btn.onclick = (e) => {

                const userReactRef = ref(
                    db,
                    `rooms/${currentRoom}/messages/${msgId}/reactions/${emo}/${userId}`
                );
                set(userReactRef, true);

                /* 💥 EMOJI BURST */
                const rect = e.target.getBoundingClientRect();
                spawnEmoji(rect.left + rect.width/2, rect.top, emo);
            };

            const liveRef = ref(
                db,
                `rooms/${currentRoom}/messages/${msgId}/reactions/${emo}`
            );

            onValue(liveRef, (s)=>{
                const data = s.val() || {};
                count.textContent = Object.keys(data).length;
            });

            btn.appendChild(count);
            box.appendChild(btn);
        });

        div.appendChild(box);
        document.getElementById("chat").appendChild(div);

        const deleteTime = d.expiresAt || (d.time + 10 * 60 * 1000);
        const timeLeft = deleteTime - Date.now();

        setTimeout(() => {
            const msgRef = ref(db, `rooms/${currentRoom}/messages/${msgId}`);
            remove(msgRef);
        }, Math.max(timeLeft, 0));

        document.getElementById("chat").scrollTop =
            document.getElementById("chat").scrollHeight;
    });
}

/* 🧼 ESCAPE */
function escapeHtml(text){
    return (text || "").replace(/[&<>"']/g, m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
    }[m]));
}

/* 🚀 SEND */
window.sendMessage = function(){
    if(!chatRef) return;

    const name = document.getElementById("name").value || "Ghost";
    const message = document.getElementById("message").value;

    if(!message.trim()) return;

    push(chatRef,{
        name,
        message,
        time: Date.now(),
        expiresAt: Date.now() + 10 * 60 * 1000
    });

    document.getElementById("message").value = "";
};

</script>

</body>
</html>
