<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Shadow Chat | Chris Legend of Shadows</title>
<meta name="theme-color" content="#000510">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://www.gstatic.com">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  font-family: 'Cinzel', Georgia, serif;
  background: #000;
  color: #c0deff;
}

/* ── SHADOW REALM BG ── */
body::before {
  content: "";
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse at 50% 0%,   rgba(0,20,70,.85), transparent 50%),
    radial-gradient(ellipse at 0%   70%, rgba(0,0,45,.8),   transparent 55%),
    radial-gradient(ellipse at 100% 70%, rgba(5,0,35,.8),   transparent 55%);
  z-index: -20;
  pointer-events: none;
}

/* ── WOLF BG IMAGE ── */
body::after {
  content: "";
  position: fixed; inset: 0;
  background-image: url("wolf.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  opacity: .12;
  z-index: -10;
  pointer-events: none;
}

/* ── CANVAS ── */
#flameCanvas {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: -5;
}

/* ── NAV ── */
nav {
  display: flex;
  justify-content: center;
  gap: 6px;
  padding: 10px 14px;
  background: rgba(0,0,10,.75);
  border-bottom: 1px solid rgba(0,100,255,.2);
  backdrop-filter: blur(14px);
  flex-wrap: wrap;
  position: relative;
  z-index: 10;
}
nav a {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: 2px;
  color: rgba(120,180,255,.7);
  text-decoration: none;
  padding: 7px 14px;
  border-radius: 30px;
  border: 1px solid rgba(0,80,200,.2);
  background: rgba(0,0,20,.4);
  transition: .2s;
  text-transform: uppercase;
}
nav a:hover {
  color: #fff;
  background: rgba(0,60,160,.3);
  border-color: rgba(0,140,255,.5);
  box-shadow: 0 0 12px rgba(0,100,255,.4);
}

/* ── HEADER ── */
header {
  text-align: center;
  padding: 8px 14px;
  background: rgba(0,5,20,.8);
  border-bottom: 1px solid rgba(0,80,200,.15);
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(10px, 2vw, 14px);
  letter-spacing: 3px;
  color: rgba(100,170,255,.7);
  text-shadow: 0 0 10px rgba(0,100,255,.4);
  position: relative; z-index: 10;
}

/* ── ROOM ENTRY SCREEN ── */
#roomScreen {
  position: fixed; inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 16px;
  background: rgba(0,0,8,.95);
  backdrop-filter: blur(20px);
  z-index: 999;
}
#roomScreen h2 {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(18px, 4vw, 32px);
  letter-spacing: 4px;
  color: #70b0ff;
  text-shadow: 0 0 20px rgba(0,100,255,.7), 0 0 50px rgba(0,60,200,.4);
}
#roomScreen .sub {
  font-size: 11px;
  letter-spacing: 5px;
  color: rgba(100,150,255,.4);
  text-transform: uppercase;
}
#roomScreen input {
  padding: 14px 20px;
  border: 1px solid rgba(0,100,200,.4);
  border-radius: 30px;
  background: rgba(0,10,40,.7);
  color: #c0deff;
  font-family: 'Cinzel', serif;
  font-size: 15px;
  text-align: center;
  width: 260px;
  outline: none;
  backdrop-filter: blur(8px);
  transition: .25s;
}
#roomScreen input:focus {
  border-color: rgba(0,150,255,.7);
  box-shadow: 0 0 16px rgba(0,100,255,.4);
}
#roomScreen button {
  padding: 14px 32px;
  border: 1px solid rgba(0,140,255,.4);
  border-radius: 30px;
  background: linear-gradient(135deg, rgba(0,70,180,.7), rgba(0,30,100,.8));
  color: #90c8ff;
  font-family: 'Cinzel Decorative', serif;
  font-size: 14px;
  letter-spacing: 3px;
  cursor: pointer;
  transition: .25s;
  text-transform: uppercase;
  box-shadow: 0 0 20px rgba(0,80,200,.3);
}
#roomScreen button:hover {
  background: linear-gradient(135deg, rgba(0,100,220,.8), rgba(0,50,150,.9));
  box-shadow: 0 0 30px rgba(0,140,255,.6), 0 0 60px rgba(0,80,200,.3);
  color: #fff;
}

/* ── CHAT AREA ── */
#chat {
  position: fixed;
  top: 85px;
  bottom: 60px;
  left: 0; right: 0;
  overflow-y: auto;
  padding: 12px 14px;
  -webkit-overflow-scrolling: touch;
}
#chat::-webkit-scrollbar { width: 4px; }
#chat::-webkit-scrollbar-track { background: transparent; }
#chat::-webkit-scrollbar-thumb { background: rgba(0,100,200,.3); border-radius: 4px; }

/* ── MESSAGE BUBBLES ── */
.msg {
  background: rgba(0,10,35,.6);
  padding: 12px 16px;
  margin-bottom: 10px;
  border-radius: 14px;
  border: 1px solid rgba(0,100,200,.2);
  backdrop-filter: blur(8px);
  position: relative;
  transition: .2s;
}
.msg:hover {
  border-color: rgba(0,140,255,.35);
  box-shadow: 0 0 14px rgba(0,80,200,.2);
}
.msg b {
  color: #70b8ff;
  font-size: 13px;
  letter-spacing: 1px;
}
.msg .msgText {
  font-family: Arial, sans-serif;
  font-size: 14px;
  color: #a0c0e0;
  margin-top: 5px;
  line-height: 1.5;
}

/* ── DELETE BTN ── */
.delBtn {
  position: absolute;
  right: 10px; top: 10px;
  padding: 4px 8px;
  border: 1px solid rgba(180,30,30,.4);
  border-radius: 8px;
  background: rgba(100,10,10,.6);
  color: rgba(255,120,120,.8);
  cursor: pointer;
  font-size: 11px;
  opacity: 0;
  transition: .2s;
}
.msg:hover .delBtn { opacity: 1; }
@media (pointer: coarse) { .delBtn { opacity: .7; } }

/* ── INPUT BAR ── */
.bottom {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  display: none;
  gap: 6px;
  padding: 8px 10px;
  background: rgba(0,5,20,.9);
  border-top: 1px solid rgba(0,80,200,.2);
  backdrop-filter: blur(14px);
  z-index: 10;
  min-height: 60px;
  align-items: center;
}
input {
  padding: 10px 14px;
  border-radius: 20px;
  border: 1px solid rgba(0,80,180,.3);
  background: rgba(0,10,40,.7);
  color: #c0deff;
  font-family: 'Cinzel', serif;
  font-size: 14px;
  outline: none;
  transition: .2s;
}
input:focus {
  border-color: rgba(0,140,255,.6);
  box-shadow: 0 0 10px rgba(0,100,255,.3);
}
#name    { width: 90px; }
#message { flex: 1; min-width: 0; }

button {
  padding: 10px 14px;
  border: 1px solid rgba(0,100,200,.3);
  border-radius: 20px;
  background: rgba(0,40,120,.7);
  color: #80c0ff;
  font-family: 'Cinzel', serif;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  transition: .2s;
}
button:hover {
  background: rgba(0,80,180,.8);
  box-shadow: 0 0 12px rgba(0,100,255,.4);
  color: #fff;
}

/* ── EMOTE PANEL ── */
#emotePanel {
  position: fixed;
  bottom: 70px; right: 10px;
  background: rgba(0,5,25,.97);
  border: 1px solid rgba(0,100,200,.35);
  border-radius: 14px;
  padding: 10px;
  display: none;
  flex-wrap: wrap;
  gap: 6px;
  width: 160px;
  z-index: 9999;
  backdrop-filter: blur(12px);
  box-shadow: 0 0 20px rgba(0,60,200,.3);
}
.emote {
  font-size: 22px;
  cursor: pointer;
  padding: 4px;
  border-radius: 6px;
  transition: .15s;
}
.emote:hover { background: rgba(0,120,255,.2); }

/* ── REACTIONS ── */
.reactions { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
.reactBtn {
  padding: 4px 8px;
  border-radius: 8px;
  border: 1px solid rgba(0,80,180,.2);
  cursor: pointer;
  background: rgba(0,15,45,.7);
  color: #80b8e8;
  font-size: 13px;
  transition: .15s;
}
.reactBtn:hover {
  background: rgba(0,60,150,.5);
  border-color: rgba(0,120,255,.4);
}
.reactCount { margin-top: 4px; font-size: 12px; opacity: .65; color: #70a0d0; font-family: Arial, sans-serif; }
</style>
</head>
<body>

<canvas id="flameCanvas"></canvas>

<nav>
  <a href="index.html">Home</a>
  <a href="gallery.html">Gallery</a>
  <a href="chat room.html" class="active">Chat</a>
  <a href="about.html">About</a>
  <a href="music.html">Music</a>
  <a href="music-player.html">Player</a>
</nav>

<header id="roomTitle">☽ SHADOW CHAT ☾ | 👥 Online: 0</header>

<div id="roomScreen">
  <h2>ENTER THE SHADOW REALM</h2>
  <div class="sub">Legend Chat · Stay Legendary</div>
  <input id="nameInput" placeholder="Your Name" maxlength="30" autocomplete="off">
  <button onclick="joinLobby()">⚔ Enter the Shadows</button>
</div>

<div id="chat"></div>
<div id="emotePanel"></div>

<div class="bottom">
  <input id="name" placeholder="Name" maxlength="30" autocomplete="off">
  <input id="message" placeholder="Message the shadows..." maxlength="300" autocomplete="off">
  <button onclick="toggleEmotes()">😄</button>
  <button onclick="sendMessage()">Send</button>
</div>

<script>
/* ── BLUE FLAMES CANVAS ── */
const isMobile = window.innerWidth < 600;
const flameC = document.getElementById("flameCanvas");
const fctx = flameC.getContext("2d");
function fitFC(){ flameC.width = innerWidth; flameC.height = innerHeight; }
fitFC();
window.addEventListener("resize", fitFC, { passive: true });
const flames = Array.from({ length: isMobile ? 35 : 70 }, () => ({
  x: Math.random()*innerWidth, y: innerHeight+Math.random()*60,
  s: 2+Math.random()*6, vy: .7+Math.random()*2,
  vx: (Math.random()-.5)*.9, alpha: .1+Math.random()*.3,
  hue: 195+Math.random()*35
}));
let lastF = 0;
function drawFlames(ts){
  if(ts-lastF<(isMobile?33:16)){ requestAnimationFrame(drawFlames); return; }
  lastF=ts;
  fctx.fillStyle="rgba(0,0,0,.18)"; fctx.fillRect(0,0,innerWidth,innerHeight);
  for(const f of flames){
    const g=fctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.s*3);
    g.addColorStop(0,`hsla(${f.hue},100%,65%,${f.alpha})`);
    g.addColorStop(.6,`hsla(${f.hue},100%,45%,${f.alpha*.3})`);
    g.addColorStop(1,"transparent");
    fctx.fillStyle=g; fctx.beginPath(); fctx.arc(f.x,f.y,f.s*3,0,Math.PI*2); fctx.fill();
    f.x+=f.vx; f.y-=f.vy;
    if(f.y<-60){ f.y=innerHeight+60; f.x=Math.random()*innerWidth; }
  }
  requestAnimationFrame(drawFlames);
}
requestAnimationFrame(drawFlames);
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase, ref, push, onChildAdded, onChildRemoved,
  set, onDisconnect, onValue, remove, off
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyByZRmp6R9HY17T2_WdJUFWeeaLNOP6y2Y",
  authDomain: "horr-a08f4.firebaseapp.com",
  databaseURL: "https://horr-a08f4-default-rtdb.firebaseio.com",
  projectId: "horr-a08f4",
  storageBucket: "horr-a08f4.firebasestorage.app",
  messagingSenderId: "933810617818",
  appId: "1:933810617818:web:efb24f123337dd987c14e3"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

let chatRef    = null;
let currentRoom = "LOBBY";
const userId   = Math.random().toString(36).substring(2, 10);
const msgListeners = {};

/* ── EMOTES ── */
const emotes = ["💀","🔥","😂","😈","👻","💯","❤️","⚡","🥶","👑"];
const panel  = document.getElementById("emotePanel");
emotes.forEach(e => {
  const span = document.createElement("span");
  span.className = "emote";
  span.textContent = e;
  span.onclick = () => {
    document.getElementById("message").value += e;
    panel.style.display = "none";
  };
  panel.appendChild(span);
});

window.toggleEmotes = function(){
  panel.style.display = panel.style.display === "flex" ? "none" : "flex";
};

window.joinLobby = function(){
  const name = document.getElementById("nameInput").value.trim() || "Shadow";
  enterRoom("LOBBY", name);
};

function fitChat(){
  const nav    = document.querySelector("nav");
  const hdr    = document.getElementById("roomTitle");
  const bottom = document.querySelector(".bottom");
  const chat   = document.getElementById("chat");
  const top    = (nav ? nav.offsetHeight : 0) + (hdr ? hdr.offsetHeight : 0);
  const bot    = bottom && bottom.style.display !== "none" ? bottom.offsetHeight : 60;
  chat.style.top    = top + "px";
  chat.style.bottom = bot + "px";
}

function enterRoom(room, name){
  currentRoom = room;
  document.getElementById("roomScreen").style.display = "none";
  document.getElementById("name").value = name;
  document.querySelector(".bottom").style.display = "flex";
  document.getElementById("chat").innerHTML = "";
  requestAnimationFrame(fitChat);
  window.addEventListener("resize", fitChat, { passive: true });
  chatRef = ref(db, "rooms/" + room + "/messages");
  setupPresence(room, name);
  listenMessages();
  autoDeleteOldMessages();
}

function setupPresence(room, name){
  const presenceRef = ref(db, "rooms/" + room + "/presence/" + userId);
  const allPresence = ref(db, "rooms/" + room + "/presence");
  function register(){ set(presenceRef, { name, online: true, ts: Date.now() }); }
  register();
  onDisconnect(presenceRef).remove();
  document.addEventListener("visibilitychange", () => {
    if(document.visibilityState === "visible") register();
  });
  onValue(allPresence, snap => {
    const data = snap.val() || {};
    const now  = Date.now();
    let live = 0;
    Object.entries(data).forEach(([uid, v]) => {
      if(v.ts && now - v.ts > 5 * 60 * 1000){
        remove(ref(db, "rooms/" + room + "/presence/" + uid));
      } else { live++; }
    });
    document.getElementById("roomTitle").textContent =
      "☽ SHADOW CHAT ☾ | 👥 Online: " + live;
  });
}

function toggleReaction(messageId, emoji){
  const reactionRef = ref(db,
    `rooms/${currentRoom}/messages/${messageId}/reactions/${emoji}/${userId}`
  );
  onValue(reactionRef, snap => {
    snap.exists() ? remove(reactionRef) : set(reactionRef, true);
  }, { onlyOnce: true });
}

function listenMessages(){
  const chatBox = document.getElementById("chat");
  const messagesRef = ref(db, "rooms/" + currentRoom + "/messages");
  const messageMap  = {};

  onChildAdded(messagesRef, snap => {
    const d   = snap.val();
    const key = snap.key;

    const div = document.createElement("div");
    div.className = "msg";

    const bold = document.createElement("b");
    bold.textContent = d.name || "Shadow";

    const msgText = document.createElement("div");
    msgText.className = "msgText";
    msgText.textContent = d.message || "";

    const reactions = document.createElement("div");
    reactions.className = "reactions";

    const countBox = document.createElement("div");
    countBox.className = "reactCount";

    ["🔥","😂","💀"].forEach(e => {
      const btn = document.createElement("button");
      btn.className = "reactBtn";
      btn.textContent = e;
      btn.onclick = () => toggleReaction(key, e);
      reactions.appendChild(btn);
    });

    function updateCounts(data){
      let out = "";
      ["🔥","😂","💀"].forEach(e => {
        const c = data?.[e] ? Object.keys(data[e]).length : 0;
        if(c > 0) out += `${e} ${c}  `;
      });
      countBox.textContent = out;
    }

    const del = document.createElement("button");
    del.className = "delBtn";
    del.textContent = "Delete";
    del.onclick = async ev => {
      ev.stopPropagation();
      await remove(ref(db, `rooms/${currentRoom}/messages/${key}`));
    };

    div.appendChild(bold);
    div.appendChild(msgText);
    div.appendChild(reactions);
    div.appendChild(countBox);
    div.appendChild(del);
    chatBox.appendChild(div);

    const msgRef = ref(db, `rooms/${currentRoom}/messages/${key}`);
    const handler = snap2 => {
      const data = snap2.val();
      if(data) updateCounts(data.reactions || {});
    };
    onValue(msgRef, handler);
    msgListeners[key] = { ref: msgRef, handler };

    messageMap[key] = div;
    chatBox.scrollTop = chatBox.scrollHeight;
  });

  onChildRemoved(messagesRef, snap => {
    const key = snap.key;
    if(messageMap[key]){ messageMap[key].remove(); delete messageMap[key]; }
    if(msgListeners[key]){
      off(msgListeners[key].ref, "value", msgListeners[key].handler);
      delete msgListeners[key];
    }
  });
}

window.sendMessage = function(){
  const name    = document.getElementById("name").value.trim() || "Shadow";
  const message = document.getElementById("message").value.trim();
  if(!chatRef || !message) return;
  push(chatRef, { name, message, time: Date.now() });
  document.getElementById("message").value = "";
};

document.getElementById("message").addEventListener("keydown", e => {
  if(e.key === "Enter") window.sendMessage();
});

document.addEventListener("click", e => {
  if(!panel.contains(e.target) && e.target.textContent !== "😄"){
    panel.style.display = "none";
  }
}, { passive: true });

function autoDeleteOldMessages(){
  const messagesRef = ref(db, "rooms/" + currentRoom + "/messages");
  setTimeout(function tick(){
    onValue(messagesRef, snap => {
      const data = snap.val() || {};
      for(const [key, msg] of Object.entries(data)){
        if(msg.time && Date.now() - msg.time > 20 * 60 * 1000){
          remove(ref(db, `rooms/${currentRoom}/messages/${key}`));
        }
      }
    }, { onlyOnce: true });
    setTimeout(tick, 2 * 60 * 1000);
  }, 30000);
}
</script>

<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", () =>
    navigator.serviceWorker.register("/sw.js").catch(() => {})
  );
}
</script>
</body>
